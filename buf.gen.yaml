version: v2
plugins:
  - remote: buf.build/protocolbuffers/python:v34.1
    out: algobowl-python-problem-server/src/algops/proto
  - remote: buf.build/protocolbuffers/pyi:v34.1
    out: algobowl-python-problem-server/src/algops/proto
  - remote: buf.build/protocolbuffers/python:v34.1
    out: .
  - remote: buf.build/protocolbuffers/pyi:v34.1
    out: .
  - remote: buf.build/connectrpc/python
    out: .
  - remote: buf.build/anthropics/buffa:v0.9.2
    out: algobowl-rust-problem-server/src/generated/buffa
    opt: [views=true]
  - remote: buf.build/connectrpc/rust:v0.9.0
    out: algobowl-rust-problem-server/src/generated/connect
    opt: [buffa_module=crate::proto]
